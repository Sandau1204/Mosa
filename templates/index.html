<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosa Activity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Bỏ qua cảnh báo của Ngrok để CSS không bị chặn -->
    <meta http-equiv="ngrok-skip-browser-warning" content="true">
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col overflow-hidden relative">

    <!-- MÀN HÌNH LOADING KHI ĐANG ĐĂNG NHẬP ACTIVITY -->
    <div id="loading-screen" class="absolute inset-0 bg-gray-900 z-50 flex flex-col items-center justify-center transition-opacity duration-500">
        <i class="fa-solid fa-circle-notch fa-spin text-5xl text-indigo-500 mb-4"></i>
        <h2 class="text-xl font-bold">Đang kết nối với Discord...</h2>
        <p class="text-gray-400 mt-2 text-sm text-center px-4">Đang xác thực tài khoản của bạn qua Embedded App SDK</p>
    </div>

    <!-- NỘI DUNG DASHBOARD CHÍNH CỦA BẠN (Giữ nguyên cấu trúc HTML Dashboard ở câu trước) -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center shadow-md z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-500 rounded-full flex items-center justify-center"><i class="fa-solid fa-robot"></i></div>
            <h1 class="text-xl font-bold">MOSA MUSIC</h1>
        </div>
        
        <div class="flex items-center gap-4">
            <span class="text-sm font-medium" id="user-name">Đang tải...</span>
            <img id="user-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" class="w-10 h-10 rounded-full border-2 border-indigo-500">
        </div>
    </header>

    <!-- (Phần body trình phát nhạc giữ nguyên như code trước) -->
    <div class="flex-1 flex items-center justify-center p-6">
        <div class="text-center">
            <h2 class="text-3xl font-bold mb-4 text-indigo-400">Dashboard Đã Sẵn Sàng!</h2>
            <p>Trình phát nhạc sẽ hiển thị tại đây.</p>
        </div>
    </div>

    <!-- TÍCH HỢP DISCORD SDK -->
    <!-- Đổi YOUR_CLIENT_ID thành Client ID thật của Bot bạn -->
    <script type="module">
        import { DiscordSDK } from "https://unpkg.com/@discord/embedded-app-sdk@1.2.0/lib/index.mjs";

        // Khởi tạo SDK
        const discordSdk = new DiscordSDK("YOUR_CLIENT_ID_ĐIỀN_VÀO_ĐÂY");

        async function setupActivity() {
            try {
                await discordSdk.ready();
                console.log("Discord SDK Ready!");

                // Hiện popup xin quyền ngay trong Discord
                const { code } = await discordSdk.commands.authorize({
                    client_id: "YOUR_CLIENT_ID_ĐIỀN_VÀO_ĐÂY",
                    response_type: "code",
                    state: "",
                    prompt: "none",
                    scope: ["identify", "guilds"]
                });

                // Gửi code về server của bạn để lấy token (Bạn cần tạo route /api/token trong webserver.py như mình hướng dẫn ở câu trước)
                const response = await fetch('/api/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });
                
                const { access_token } = await response.json();

                // Xác thực Activity
                const auth = await discordSdk.commands.authenticate({ access_token });
                
                if (auth) {
                    // Cập nhật giao diện
                    document.getElementById("user-name").innerText = auth.user.username;
                    if(auth.user.avatar) {
                        document.getElementById("user-avatar").src = `https://cdn.discordapp.com/avatars/${auth.user.id}/${auth.user.avatar}.png`;
                    }
                    
                    // Ẩn màn hình loading
                    document.getElementById("loading-screen").style.opacity = "0";
                    setTimeout(() => document.getElementById("loading-screen").style.display = "none", 500);
                }
            } catch (error) {
                console.error("Lỗi:", error);
                document.getElementById("loading-screen").innerHTML = `
                    <i class="fa-solid fa-triangle-exclamation text-5xl text-red-500 mb-4"></i>
                    <h2 class="text-xl font-bold text-red-400">Lỗi kết nối SDK</h2>
                    <p class="text-gray-400 mt-2">${error.message || "Không thể xác thực Discord Activity"}</p>
                `;
            }
        }

        // Chạy hàm thiết lập
        setupActivity();
    </script>
</body>
</html>
