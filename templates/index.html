<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosa Music Dashboard</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-base: #313338;
            --bg-panel: #2b2d31;
            --bg-input: #1e1f22;
            --bg-hover: #3f4147;
            --accent: #5865F2;
            --accent-hover: #4752C4;
            --text-normal: #dbdee1;
            --text-muted: #949ba4;
            --text-header: #f2f3f5;
            --danger: #da373c;
            --success: #23a559;
            --radius-md: 8px;
            --radius-lg: 12px;
            --transition: 0.2s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body { background-color: var(--bg-base); color: var(--text-normal); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Loading Screen */
        #loading-screen { position: fixed; inset: 0; background-color: var(--bg-base); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--bg-panel); border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Header */
        header { background-color: var(--bg-panel); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.2); z-index: 10; }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 1.25rem; font-weight: 700; color: var(--text-header); }
        .brand-icon { background: var(--accent); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .user-profile { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--bg-hover); object-fit: cover; }

        /* Main Layout */
        .app-container { flex: 1; display: grid; grid-template-columns: 2fr 1.2fr; gap: 20px; padding: 20px; overflow: hidden; max-width: 1400px; margin: 0 auto; width: 100%; }
        @media (max-width: 900px) { .app-container { grid-template-columns: 1fr; overflow-y: auto; } }

        .panel { background-color: var(--bg-panel); border-radius: var(--radius-lg); padding: 20px; display: flex; flex-direction: column; }
        
        /* Connection Status Bar */
        .status-bar { background-color: var(--bg-input); border-radius: var(--radius-md); padding: 12px 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .status-indicator { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 0.95rem; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background-color: var(--danger); box-shadow: 0 0 8px var(--danger); transition: 0.3s; }
        .dot.connected { background-color: var(--success); box-shadow: 0 0 8px var(--success); }
        .btn-action { font-weight: 600; padding: 8px 16px; border-radius: 6px; cursor: pointer; transition: 0.2s; border: none; font-size: 0.85rem; color: white; }
        .btn-connect { background-color: var(--accent); }
        .btn-connect:hover { background-color: var(--accent-hover); }
        .btn-disconnect { background-color: var(--danger); }
        .btn-disconnect:hover { background-color: #b92b30; }

        /* Search Bar */
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-input { flex: 1; background-color: var(--bg-input); color: var(--text-normal); border: none; padding: 12px 16px; border-radius: var(--radius-md); font-size: 0.95rem; outline: none; }
        .btn-search { background-color: var(--accent); color: white; border: none; padding: 0 20px; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; }

        /* Now Playing */
        .now-playing { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .thumbnail-container { width: 100%; max-width: 300px; aspect-ratio: 16/9; margin-bottom: 24px; border-radius: var(--radius-lg); overflow: hidden; background-color: var(--bg-input); position: relative; }
        .thumbnail { width: 100%; height: 100%; object-fit: cover; }
        .empty-thumbnail-svg { width: 100%; height: 100%; }
        .spin-slow { animation: spin 4s linear infinite; }
        .spin-paused { animation-play-state: paused; }

        .song-info { margin-bottom: 24px; width: 100%; }
        .song-title { font-size: 1.5rem; font-weight: 700; color: var(--text-header); margin-bottom: 4px; }
        .song-author { font-size: 1rem; color: var(--text-muted); }

        /* Controls */
        .controls { display: flex; align-items: center; justify-content: center; gap: 24px; margin-top:20px; }
        .btn-ctrl { background: none; border: none; color: var(--text-muted); cursor: pointer; transition: 0.2s; }
        .btn-ctrl:hover { color: var(--text-header); transform: scale(1.1); }
        .btn-ctrl svg { width: 24px; height: 24px; fill: currentColor; }
        .btn-play { background-color: var(--text-header); color: var(--bg-panel); width: 56px; height: 56px; border-radius: 50%; }

        /* Toast Container */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 12px 20px; background-color: var(--bg-panel); color: white; border-radius: 6px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); font-size: 0.9rem; font-weight: 500; border-left: 4px solid var(--accent); animation: slideIn 0.3s ease; }
        .toast.error { border-left-color: var(--danger); }
        .toast.success { border-left-color: var(--success); }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>

    <!-- MÀN HÌNH LOADING -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <h2 style="font-size: 1.2rem; color: var(--text-header);" id="loading-title">Đang khởi tạo Mosa Music...</h2>
        <div id="debug-log" style="color: #949ba4; margin-top: 10px; font-size: 0.9rem; text-align: center;"></div>
    </div>

    <!-- TOAST THÔNG BÁO -->
    <div id="toast-container"></div>

    <header>
        <div class="brand"><div class="brand-icon">🤖</div>MOSA DASHBOARD</div>
        <div class="user-profile">
            <span class="user-name" id="user-name">Đang tải...</span>
            <img class="avatar" id="user-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
        </div>
    </header>

    <div class="app-container">
        
        <main class="panel player-section">
            <!-- THANH TRẠNG THÁI KẾT NỐI -->
            <div class="status-bar">
                <div class="status-indicator">
                    <div class="dot" id="status-dot"></div>
                    <span id="status-text">Bot chưa tham gia kênh thoại</span>
                </div>
                <div>
                    <button class="btn-action btn-connect" id="btn-connect" onclick="connectBot()">Kết nối Bot</button>
                    <button class="btn-action btn-disconnect" id="btn-disconnect" onclick="disconnectBot()" style="display: none;">Ngắt kết nối</button>
                </div>
            </div>

            <!-- THANH TÌM KIẾM -->
            <form class="search-box" id="search-form">
                <input type="text" class="search-input" id="search-input" placeholder="Tìm kiếm bài hát hoặc dán Link..." required>
                <button type="submit" class="btn-search">Phát nhạc</button>
            </form>

            <div class="now-playing">
                <div class="thumbnail-container">
                    <svg id="np-svg" viewBox="0 0 100 100" class="empty-thumbnail-svg spin-slow spin-paused">
                        <rect width="100" height="100" fill="#1e1f22"/>
                        <circle cx="50" cy="50" r="42" fill="#111214" stroke="#2b2d31" stroke-width="2"/>
                        <circle cx="50" cy="50" r="32" fill="none" stroke="#2b2d31" stroke-width="1"/>
                        <circle cx="50" cy="50" r="22" fill="none" stroke="#2b2d31" stroke-width="1"/>
                        <circle cx="50" cy="50" r="12" fill="#5865F2"/>
                        <circle cx="50" cy="50" r="3" fill="#1e1f22"/>
                        <path d="M48 42 v-4 h5 v1 h-3 v3 a2 2 0 1 0 2 2 v-5" fill="#ffffff"/>
                    </svg>
                    <img src="" id="np-thumbnail" class="thumbnail" style="display: none;" alt="Thumbnail">
                </div>
                
                <div class="song-info">
                    <h2 class="song-title" id="np-title">Chưa có bài hát nào</h2>
                    <p class="song-author" id="np-author">Hãy tìm kiếm để bắt đầu</p>
                </div>

                <div class="controls">
                    <button class="btn-ctrl" onclick="showToast('Tính năng chưa hoàn thiện', 'error')"><svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
                    <button class="btn-ctrl" onclick="showToast('Lùi bài', 'success')"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                    <button class="btn-ctrl btn-play" id="btn-play-pause" onclick="togglePlay()">
                        <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="icon-pause" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="btn-ctrl" onclick="showToast('Chuyển bài', 'success')"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
                </div>
            </div>
        </main>

        <aside class="panel">
            <h3 style="font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-list"></i> Danh sách chờ
            </h3>
            <div style="flex:1; display:flex; justify-content:center; align-items:center; color: var(--text-muted);">
                Hàng đợi đang trống.
            </div>
        </aside>
    </div>

    <!-- DỮ LIỆU TỪ FLASK JINJA2 -->
    <script>
        const webUser = {{ user | tojson | safe if user else 'null' }};
    </script>

    <!-- SCRIPT ĐIỀU KHIỂN & KẾT NỐI -->
    <script type="module">
        let globalUserId = null;

        // --- HÀM TẠO THÔNG BÁO (TOAST) ---
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        // --- KHỞI TẠO ĐĂNG NHẬP ---
        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const loadingScreen = document.getElementById("loading-screen");

            if (!urlParams.get('frame_id')) {
                // Đăng nhập qua Web
                if (webUser) {
                    globalUserId = webUser.id;
                    updateUserUI(webUser.username, webUser.avatar, webUser.id);
                    hideLoading();
                } else {
                    window.location.href = "/login";
                }
            } else {
                // Đăng nhập qua Activity
                try {
                    const CLIENT_ID = "1321104228361703424"; 
                    const module = await import("/static/discord-sdk.mjs");
                    const discordSdk = new module.DiscordSDK(CLIENT_ID);
                    await discordSdk.ready();

                    const { code } = await discordSdk.commands.authorize({
                        client_id: CLIENT_ID, response_type: "code", state: "", prompt: "none", scope: ["identify", "guilds"]
                    });

                    const response = await fetch('/api/token', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: code })
                    });
                    const data = await response.json();
                    
                    const auth = await discordSdk.commands.authenticate({ access_token: data.access_token });
                    if (auth) {
                        globalUserId = auth.user.id;
                        updateUserUI(auth.user.username, auth.user.avatar, auth.user.id);
                        hideLoading();
                    }
                } catch (err) {
                    document.getElementById("debug-log").innerText = err.message;
                    document.getElementById("loading-title").innerText = "Lỗi xác thực!";
                }
            }

            // Bắt đầu vòng lặp kiểm tra trạng thái Voice Channel 
            if (globalUserId) {
                setInterval(checkConnectionStatus, 3000);
            }
        }

        function updateUserUI(username, avatarHash, userId) {
            document.getElementById("user-name").innerText = username;
            if(avatarHash) document.getElementById("user-avatar").src = `https://cdn.discordapp.com/avatars/${userId}/${avatarHash}.png`;
        }

        function hideLoading() {
            const s = document.getElementById("loading-screen");
            s.style.opacity = "0";
            setTimeout(() => s.style.display = "none", 500);
        }

        // --- API CALLS (VOICE CHANNEL) ---
        window.connectBot = async function() {
            if (!globalUserId) return;
            try {
                const res = await fetch('/api/connect', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: globalUserId })
                });
                const data = await res.json();
                
                if (data.error) {
                    showToast(data.error, 'error');
                } else {
                    showToast(`Đã kết nối vào ${data.channel_name}`, 'success');
                    updateConnectionUI(true, data.channel_name);
                }
            } catch (e) { showToast('Lỗi mạng', 'error'); }
        }

        window.disconnectBot = async function() {
            if (!globalUserId) return;
            try {
                const res = await fetch('/api/disconnect', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: globalUserId })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('Bot đã rời kênh', 'success');
                    updateConnectionUI(false);
                }
            } catch (e) {}
        }

        async function checkConnectionStatus() {
            if (!globalUserId) return;
            try {
                const res = await fetch('/api/connection_status', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: globalUserId })
                });
                const data = await res.json();
                updateConnectionUI(data.connected, data.channel_name);
                if (data.connected && data.title) {
                    document.getElementById('np-title').innerText = data.title;
                    document.getElementById('np-author').innerText = data.author;

                    if (data.thumbnail) {
                        document.getElementById('np-thumbnail').src = data.thumbnail;
                        document.getElementById('np-thumbnail').style.display = 'block';
                        document.getElementById('np-svg').style.display = 'none';
                    }
                
                    // Đồng bộ nút Play/Pause
                    isPlaying = data.is_playing;
                    document.getElementById('icon-play').style.display = isPlaying ? 'none' : 'block';
                    document.getElementById('icon-pause').style.display = isPlaying ? 'block' : 'none';

                    if (isPlaying) {
                        document.getElementById('np-svg').classList.remove('spin-paused');
                    } else {
                        document.getElementById('np-svg').classList.add('spin-paused');
                    }
                }     
            } catch (e) {}
        }

        function updateConnectionUI(isConnected, channelName = "") {
            const dot = document.getElementById("status-dot");
            const text = document.getElementById("status-text");
            const btnConnect = document.getElementById("btn-connect");
            const btnDisconnect = document.getElementById("btn-disconnect");

            if (isConnected) {
                dot.classList.add("connected");
                text.innerText = `Đang kết nối: 🔊 ${channelName}`;
                text.style.color = "var(--success)";
                btnConnect.style.display = "none";
                btnDisconnect.style.display = "block";
            } else {
                dot.classList.remove("connected");
                text.innerText = "Bot chưa tham gia kênh thoại";
                text.style.color = "var(--text-muted)";
                btnConnect.style.display = "block";
                btnDisconnect.style.display = "none";
            }
        }

        // --- ĐIỀU KHIỂN NHẠC GIAO DIỆN ---
        let isPlaying = false;
        window.togglePlay = function() {
            isPlaying = !isPlaying;
            document.getElementById('icon-play').style.display = isPlaying ? 'none' : 'block';
            document.getElementById('icon-pause').style.display = isPlaying ? 'block' : 'none';
            if (isPlaying) document.getElementById('np-svg').classList.remove('spin-paused');
            else document.getElementById('np-svg').classList.add('spin-paused');
        }

        document.getElementById('search-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const query = document.getElementById('search-input').value;
            
            // Ở đây bạn có thể gọi fetch('/api/play') để đẩy nhạc lên Python
            showToast(`Đang tìm kiếm: ${query}`, 'success');
            document.getElementById('search-input').value = "";
        });

        init();
    </script>
</body>
</html>
