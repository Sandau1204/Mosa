<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosa Music Dashboard</title>
    
    <style>
        /* CSS Reset & Variables */
        :root {
            --bg-base: #313338;
            --bg-panel: #2b2d31;
            --bg-input: #1e1f22;
            --bg-hover: #3f4147;
            --accent: #5865F2;
            --accent-hover: #4752C4;
            --text-normal: #dbdee1;
            --text-muted: #949ba4;
            --text-header: #f2f3f5;
            --danger: #da373c;
            --radius-md: 8px;
            --radius-lg: 12px;
            --transition: 0.2s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: var(--bg-base);
            color: var(--text-normal);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed; inset: 0; background-color: var(--bg-base);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid var(--bg-panel);
            border-top: 4px solid var(--accent); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Header */
        header {
            background-color: var(--bg-panel); padding: 12px 24px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2); z-index: 10;
        }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 1.25rem; font-weight: 700; color: var(--text-header); }
        .brand-icon { background: var(--accent); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .user-profile { display: flex; align-items: center; gap: 12px; }
        .user-name { font-weight: 600; font-size: 0.9rem; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--bg-hover); object-fit: cover; }

        /* Main Layout */
        .app-container {
            flex: 1; display: grid; grid-template-columns: 2fr 1.2fr;
            gap: 20px; padding: 20px; overflow: hidden; max-width: 1400px; margin: 0 auto; width: 100%;
        }
        @media (max-width: 900px) {
            .app-container { grid-template-columns: 1fr; overflow-y: auto; }
        }

        .panel { background-color: var(--bg-panel); border-radius: var(--radius-lg); padding: 20px; display: flex; flex-direction: column; }
        .panel-title { font-size: 1.1rem; font-weight: 700; color: var(--text-header); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

        /* Search Bar */
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-input {
            flex: 1; background-color: var(--bg-input); color: var(--text-normal);
            border: none; padding: 12px 16px; border-radius: var(--radius-md);
            font-size: 0.95rem; outline: none; transition: var(--transition);
        }
        .search-input:focus { box-shadow: 0 0 0 2px var(--accent); }
        .btn-search {
            background-color: var(--accent); color: white; border: none;
            padding: 0 20px; border-radius: var(--radius-md); font-weight: 600;
            cursor: pointer; transition: var(--transition);
        }
        .btn-search:hover { background-color: var(--accent-hover); }

        /* Now Playing Card */
        .now-playing { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .thumbnail-container {
            width: 100%; max-width: 320px; aspect-ratio: 16/9; margin-bottom: 24px;
            border-radius: var(--radius-lg); overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4); background-color: var(--bg-input);
        }
        
        .thumbnail { width: 100%; height: 100%; object-fit: cover; }
        
        /* Hiệu ứng đĩa than quay */
        .empty-thumbnail-svg { width: 100%; height: 100%; }
        .spin-slow { animation: spin 4s linear infinite; }
        .spin-paused { animation-play-state: paused; }

        .song-info { margin-bottom: 24px; width: 100%; }
        .song-title { font-size: 1.5rem; font-weight: 700; color: var(--text-header); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 10px; }
        .song-author { font-size: 1rem; color: var(--text-muted); }

        /* Progress Bar */
        .progress-container { width: 100%; max-width: 400px; margin-bottom: 20px; }
        .progress-bar { width: 100%; height: 6px; background-color: var(--bg-input); border-radius: 3px; cursor: pointer; position: relative; }
        .progress-fill { height: 100%; background-color: var(--accent); border-radius: 3px; width: 0%; transition: width 0.1s linear; position: relative; }
        .time-info { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; font-variant-numeric: tabular-nums; }

        /* Controls */
        .controls { display: flex; align-items: center; justify-content: center; gap: 24px; }
        .btn-ctrl { background: none; border: none; color: var(--text-muted); cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; }
        .btn-ctrl:hover { color: var(--text-header); transform: scale(1.1); }
        .btn-ctrl svg { width: 24px; height: 24px; fill: currentColor; }
        .btn-play { background-color: var(--text-header); color: var(--bg-panel); width: 56px; height: 56px; border-radius: 50%; }
        .btn-play:hover { background-color: white; transform: scale(1.05); color: var(--bg-base); }
        .btn-play svg { width: 28px; height: 28px; }

        /* Queue List */
        .queue-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
        .queue-item {
            display: flex; align-items: center; gap: 12px; padding: 8px;
            border-radius: var(--radius-md); transition: var(--transition);
            background-color: var(--bg-base); cursor: pointer;
        }
        .queue-item:hover { background-color: var(--bg-hover); }
        .q-thumb { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; background-color: var(--bg-input); flex-shrink: 0; }
        .q-info { flex: 1; min-width: 0; }
        .q-title { font-size: 0.9rem; font-weight: 600; color: var(--text-header); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
        .q-author { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .empty-queue { text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <!-- MÀN HÌNH LOADING -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <h2 style="font-size: 1.2rem; color: var(--text-header);">Đang khởi tạo Mosa Music...</h2>
        <p style="color: var(--text-muted); margin-top: 8px; font-size: 0.9rem;" id="loading-status">Vui lòng chờ giây lát</p>
    </div>

    <header>
        <div class="brand">
            <div class="brand-icon">🤖</div>
            MOSA DASHBOARD
        </div>
        <div class="user-profile">
            <span class="user-name" id="user-name">Đang tải...</span>
            <img class="avatar" id="user-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
        </div>
    </header>

    <div class="app-container">
        
        <!-- Cột Trái: Trình phát -->
        <main class="panel player-section">
            <form class="search-box" id="search-form">
                <input type="text" class="search-input" id="search-input" placeholder="Tìm kiếm bài hát hoặc dán Link..." required>
                <button type="submit" class="btn-search">Phát nhạc</button>
            </form>

            <div class="now-playing">
                <div class="thumbnail-container">
                    
                    <!-- SVG ĐĨA NHẠC TRỐNG (Không bao giờ bị lỗi CSP của Discord) -->
                    <svg id="np-svg" viewBox="0 0 100 100" class="empty-thumbnail-svg spin-slow spin-paused">
                        <rect width="100" height="100" fill="#1e1f22"/>
                        <!-- Viền đĩa -->
                        <circle cx="50" cy="50" r="42" fill="#111214" stroke="#2b2d31" stroke-width="2"/>
                        <!-- Rãnh đĩa -->
                        <circle cx="50" cy="50" r="32" fill="none" stroke="#2b2d31" stroke-width="1"/>
                        <circle cx="50" cy="50" r="22" fill="none" stroke="#2b2d31" stroke-width="1"/>
                        <!-- Tâm đĩa màu Discord -->
                        <circle cx="50" cy="50" r="12" fill="#5865F2"/>
                        <!-- Lỗ giữa -->
                        <circle cx="50" cy="50" r="3" fill="#1e1f22"/>
                        <!-- Nốt nhạc icon ở giữa -->
                        <path d="M48 42 v-4 h5 v1 h-3 v3 a2 2 0 1 0 2 2 v-5" fill="#ffffff"/>
                    </svg>

                    <!-- ẢNH THUMBNAIL (Sẽ được JS bật lên nếu có link ảnh) -->
                    <img src="" id="np-thumbnail" class="thumbnail" style="display: none;" alt="Thumbnail">
                </div>
                
                <div class="song-info">
                    <h2 class="song-title" id="np-title">Chưa có bài hát nào</h2>
                    <p class="song-author" id="np-author">Hãy tìm kiếm để bắt đầu</p>
                </div>

                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <div class="time-info">
                        <span id="time-current">0:00</span>
                        <span id="time-total">0:00</span>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn-ctrl" onclick="alert('Chức năng Trộn bài')" title="Trộn bài">
                        <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                    </button>
                    <button class="btn-ctrl" onclick="alert('Lùi bài')" title="Bài trước">
                        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="btn-ctrl btn-play" id="btn-play-pause" onclick="togglePlay()">
                        <!-- Icon Play -->
                        <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <!-- Icon Pause -->
                        <svg id="icon-pause" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="btn-ctrl" onclick="alert('Chuyển bài')" title="Bài tiếp">
                        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                    <button class="btn-ctrl" onclick="alert('Chức năng Lặp')" title="Lặp lại">
                        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                    </button>
                </div>
            </div>
        </main>

        <!-- Cột Phải: Danh sách chờ -->
        <aside class="panel queue-section">
            <h3 class="panel-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3-1.34 3-3V8h3V6h-5z"/></svg>
                Danh sách chờ
            </h3>
            
            <div class="queue-list" id="queue-list">
                <div class="empty-queue">Chưa có bài hát nào trong hàng chờ.</div>
            </div>
        </aside>
    </div>

    <!-- DỮ LIỆU TỪ FLASK JINJA2 (Dành riêng cho Web) -->
    <script>
        const webUser = {{ user | tojson | safe if user else 'null' }};
    </script>

    <!-- KỊCH BẢN CHÍNH -->
    <script type="module">
        // ----------------------------------------------------------------
        // 1. KIỂM TRA ĐĂNG NHẬP (WEB & DISCORD ACTIVITY)
        // ----------------------------------------------------------------
        async function checkAuthentication() {
            const urlParams = new URLSearchParams(window.location.search);
            const loadingScreen = document.getElementById("loading-screen");
            const loadingStatus = document.getElementById("loading-status");

            // NẾU MỞ TRÊN WEB (Không có tham số frame_id của Activity)
            if (!urlParams.get('frame_id')) {
                if (webUser) {
                    // Đã đăng nhập Web
                    document.getElementById("user-name").innerText = webUser.username;
                    if(webUser.avatar) {
                        document.getElementById("user-avatar").src = `https://cdn.discordapp.com/avatars/${webUser.id}/${webUser.avatar}.png`;
                    }
                    loadingScreen.style.opacity = "0";
                    setTimeout(() => loadingScreen.style.display = "none", 500);
                    return; // Ngưng, không chạy SDK
                } else {
                    // Chưa đăng nhập -> Đá về trang đăng nhập
                    window.location.href = "/login";
                    return;
                }
            }

            // NẾU MỞ TRONG DISCORD ACTIVITY
            try {
                loadingStatus.innerText = "Đang kết nối SDK...";
                
                // ĐIỀN CLIENT ID CỦA BOT VÀO ĐÂY BẮT BUỘC
                const CLIENT_ID = "1321104228361703424"; 
                
                const module = await import("/static/discord-sdk.mjs");
                const DiscordSDK = module.DiscordSDK;
                const discordSdk = new DiscordSDK(CLIENT_ID);
                await discordSdk.ready();

                loadingStatus.innerText = "Vui lòng phê duyệt ủy quyền Discord...";
                const { code } = await discordSdk.commands.authorize({
                    client_id: CLIENT_ID,
                    response_type: "code",
                    state: "",
                    prompt: "none",
                    scope: ["identify", "guilds"]
                });

                loadingStatus.innerText = "Đang trao đổi Token...";
                const response = await fetch('/api/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });
                
                if (!response.ok) throw new Error("Không thể kết nối đến máy chủ Backend.");
                const data = await response.json();
                
                const auth = await discordSdk.commands.authenticate({ access_token: data.access_token });
                
                if (auth) {
                    document.getElementById("user-name").innerText = auth.user.username;
                    if(auth.user.avatar) {
                        document.getElementById("user-avatar").src = `https://cdn.discordapp.com/avatars/${auth.user.id}/${auth.user.avatar}.png`;
                    }
                    loadingScreen.style.opacity = "0";
                    setTimeout(() => loadingScreen.style.display = "none", 500);
                }
            } catch (error) {
                loadingStatus.innerHTML = `<span style="color: #da373c">Lỗi xác thực: ${error.message || "Hãy thử tải lại"}</span>`;
            }
        }

        // Chạy kiểm tra đăng nhập
        checkAuthentication();

        // ----------------------------------------------------------------
        // 2. MÔ PHỎNG LOGIC GIAO DIỆN (Nút Play/Pause & Đổi Avatar)
        // ----------------------------------------------------------------
        let isPlaying = false;
        
        window.togglePlay = function() {
            // Đảo ngược trạng thái
            isPlaying = !isPlaying;
            
            // Đổi Icon Play / Pause
            document.getElementById('icon-play').style.display = isPlaying ? 'none' : 'block';
            document.getElementById('icon-pause').style.display = isPlaying ? 'block' : 'none';
            
            // Xử lý đĩa than quay / dừng
            const svgDisc = document.getElementById('np-svg');
            if (isPlaying) {
                svgDisc.classList.remove('spin-paused');
            } else {
                svgDisc.classList.add('spin-paused');
            }
        }

        // ----------------------------------------------------------------
        // CHỖ NÀY BẠN TỰ KẾT NỐI API PYTHON CỦA BẠN VÀO NHÉ
        // Hàm load nhạc giả lập để bạn xem thử giao diện:
        // ----------------------------------------------------------------
        document.getElementById('search-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const query = document.getElementById('search-input').value;
            
            // Ví dụ đổi giao diện ngay lập tức
            document.getElementById('np-title').innerText = query;
            document.getElementById('np-author').innerText = "Đang tải dữ liệu từ Bot...";
            
            // Kích hoạt xoay đĩa than
            isPlaying = true;
            document.getElementById('icon-play').style.display = 'none';
            document.getElementById('icon-pause').style.display = 'block';
            document.getElementById('np-svg').classList.remove('spin-paused');
            
            document.getElementById('search-input').value = "";
            alert("Đã gửi lệnh phát nhạc tới Bot!");
        });
    </script>
</body>
</html>
