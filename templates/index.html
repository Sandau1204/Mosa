<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosa Music Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --sidebar-bg: #000000;
            --accent: #1db954; /* Màu xanh lá nổi bật */
            --accent-hover: #1ed760;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --border: #333333;
        }

        body {
            background-image: url("{{ url_for('static', filename='background.jpg') }}");
            background-size: cover;     
            background-position: center; 
            background-repeat: no-repeat; 
            background-attachment: fixed; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            font-family: 'Lexend', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        /* --- Main Layout --- */
        .dashboard-container {
            width: 100%;
            max-width: 1200px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .top-bar {
            padding: 15px 25px;
            background: rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .brand-logo {
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- Form Elements (Dark Theme) --- */
        .form-select, .form-control {
            background-color: #2a2a2a !important;
            border: 1px solid #404040;
            color: #fff !important;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .form-select:focus, .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(29, 185, 84, 0.2);
        }

        /* --- Layout Columns --- */
        .main-content {
            padding: 20px;
        }

        /* --- Player Section (Left) --- */
        .player-section {
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            height: 100%;
        }

        .art-box {
            width: 100%;
            aspect-ratio: 1/1;
            max-width: 300px;
            margin: 0 auto 20px auto;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            background: #000;
        }
        
        .art-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        .no-music-placeholder {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #2a2a2a, #121212);
            color: #404040; font-size: 4rem;
        }

        .track-info h4 { font-weight: 700; margin-bottom: 5px; font-size: 1.2rem; }
        .track-info p { color: var(--text-sub); font-size: 0.9rem; margin-bottom: 15px; }

        /* Progress Bar */
        .progress-container { display: flex; align-items: center; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 20px; }
        .progress-bar-slider {
            flex-grow: 1; margin: 0 10px; -webkit-appearance: none; height: 4px;
            background: #404040; border-radius: 2px; outline: none; cursor: pointer;
        }
        .progress-bar-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 12px; height: 12px;
            background: var(--text-main); border-radius: 50%; cursor: pointer; transition: 0.2s;
        }
        .progress-bar-slider:hover::-webkit-slider-thumb { background: var(--accent); transform: scale(1.2); }

        /* Controls */
        .controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; }
        .controls button {
            background: none; border: none; color: var(--text-sub);
            font-size: 1.2rem; transition: 0.2s; width: 40px; height: 40px; border-radius: 50%;
        }
        .controls button:hover { color: var(--text-main); background: rgba(255,255,255,0.1); }
        
        .controls .btn-play {
            background: var(--accent); color: #000;
            width: 60px; height: 60px; font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.3);
        }
        .controls .btn-play:hover { background: var(--accent-hover); color: #000; transform: scale(1.05); }
        .btn-active { color: var(--accent) !important; position: relative; }
        .btn-active::after { content: '.'; position: absolute; bottom: 0; font-size: 30px; color: var(--accent); line-height: 0; }

        /* --- Queue Section (Right) --- */
        .queue-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .queue-header h5 { margin: 0; font-weight: 600; font-size: 1rem; }

        .queue-box {
            height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }
        /* Custom Scrollbar */
        .queue-box::-webkit-scrollbar { width: 6px; }
        .queue-box::-webkit-scrollbar-track { background: #121212; }
        .queue-box::-webkit-scrollbar-thumb { background: #404040; border-radius: 3px; }

        .queue-item {
            display: flex; align-items: center;
            padding: 10px;
            border-radius: 6px;
            background: transparent;
            transition: 0.2s;
            cursor: grab;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .queue-item:hover { background: rgba(255,255,255,0.05); }
        .queue-item:active { cursor: grabbing; }
        
        .q-idx { color: var(--accent); font-weight: bold; width: 25px; font-size: 0.9rem; }
        .q-info { flex-grow: 1; min-width: 0; }
        .q-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; font-size: 0.95rem; }
        .q-artist { font-size: 0.8rem; color: var(--text-sub); }
        .q-drag { color: #404040; }

        /* --- Search & Bottom Area --- */
        .bottom-actions { margin-top: 20px; }
        .search-group { position: relative; }
        .search-group input { padding-right: 50px; background: #121212 !important; border: 1px solid transparent; }
        .search-group input:focus { border-color: var(--accent); background: #2a2a2a !important; }
        .search-btn {
            position: absolute; right: 5px; top: 4px;
            border: none; background: none; color: var(--text-sub);
            font-size: 1.1rem;
        }
        .search-btn:hover { color: var(--accent); }

        /* --- Modals (Dark) --- */
        .modal-content { background-color: #282828; color: var(--text-main); border: 1px solid var(--border); }
        .modal-header { border-bottom: 1px solid var(--border); }
        .list-group-item { background-color: #121212; color: white; border: 1px solid var(--border); }
        .list-group-item:hover { background-color: #333; }
        .btn-close { filter: invert(1); }

        /* --- Responsive Tweaks --- */
        @media (max-width: 768px) {
            .dashboard-container { border-radius: 0; border: none; }
            .player-section { margin-bottom: 20px; }
            .queue-box { height: auto; max-height: 300px; }
            .controls button { width: 50px; height: 50px; font-size: 1.4rem; }
            .controls .btn-play { width: 70px; height: 70px; }
            .top-bar { flex-direction: column; gap: 10px; align-items: stretch; }
            .top-actions { display: flex; gap: 10px; }
        }
        
        /* Status Badge */
        .status-badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 10px; background: #333; color: #999; margin-left: 10px; display: inline-block;}
        .status-connected { background: rgba(29, 185, 84, 0.2); color: var(--accent); border: 1px solid var(--accent); }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="top-bar">
            <div class="brand-logo">
                <i class="fas fa-music"></i> MOSA DASHBOARD <span id="trackChannel" class="status-badge">Chưa kết nối</span>
            </div>
            
            <div class="top-actions d-flex gap-2">
                <select id="guildSelect" class="form-select form-select-sm" onchange="loadChannels()" style="max-width: 150px;">
                    <option value="" disabled selected>Server...</option>
                </select>
                <select id="channelSelect" class="form-select form-select-sm" style="max-width: 130px;">
                    <option value="" disabled selected>Kênh...</option>
                </select>
                <button onclick="joinChannel()" class="btn btn-sm btn-outline-success" title="Join"><i class="fas fa-link"></i></button>
                <button onclick="leaveChannel()" class="btn btn-sm btn-outline-danger" title="Leave"><i class="fas fa-power-off"></i></button>
            </div>
        </div>

        <div class="main-content">
            <div class="row g-4">
                <div class="col-lg-5">
                    <div class="player-section">
                        <div class="art-box">
                            <img id="trackArt" src="" class="art-img" alt="Album Art">
                            <div id="noMusicPlaceholder" class="no-music-placeholder">
                                <i class="fas fa-compact-disc fa-spin" style="animation-duration: 3s;"></i>
                            </div>
                        </div>

                        <div class="track-info">
                            <h4 id="trackTitle" class="text-truncate">Sẵn sàng</h4>
                            <p id="trackArtist">Vui lòng chọn bài hát</p>
                        </div>

                        <div class="progress-container">
                            <span id="timeCurrent">00:00</span>
                            <input type="range" id="progressBar" class="progress-bar-slider" value="0" min="0" max="100" onchange="seekAudio(this.value)" oninput="isSeeking=true">
                            <span id="timeTotal">00:00</span>
                        </div>

                        <div class="controls">
                            <button onclick="cmd('loop')" id="btnLoop" title="Lặp lại"><i class="fas fa-repeat"></i></button>
                            <button onclick="cmd('vol_down')"><i class="fas fa-volume-low"></i></button>
                            <button onclick="cmd('pause_resume')" class="btn-play"><i id="iconPlay" class="fas fa-play"></i></button>
                            <button onclick="cmd('vol_up')"><i class="fas fa-volume-high"></i></button>
                            <button onclick="cmd('skip')"><i class="fas fa-forward-step"></i></button>
                        </div>
                    </div>
                </div>

                <div class="col-lg-7">
                    <div class="queue-header">
                        <h5><i class="fas fa-list-ul me-2 text-success"></i> Hàng đợi</h5>
                        <button onclick="cmd('stop')" class="btn btn-sm btn-outline-secondary" style="font-size: 0.8rem;">Xóa Hàng Đợi</button>
                    </div>

                    <div class="queue-box" id="queueList">
                        <div class="text-center text-muted py-5">
                            <i class="fas fa-music mb-2" style="font-size: 2rem; opacity: 0.3;"></i><br>
                            Hàng đợi trống
                        </div>
                    </div>

                    <div class="bottom-actions mt-3">
                        <div class="row g-2">
                            <div class="col-8">
                                <div class="search-group">
                                    <input type="text" id="searchQuery" class="form-control" placeholder="Tìm tên bài hoặc dán link..." onkeypress="handleEnter(event)">
                                    <button onclick="handleSearchOrPlay()" class="search-btn"><i class="fas fa-search"></i></button>
                                </div>
                            </div>
                            <div class="col-4">
                                <button onclick="openPlaylists()" class="btn btn-outline-light w-100 h-100" style="background: #2a2a2a; border:none; color: #fff;">
                                    <i class="fas fa-bookmark text-success"></i> Playlist
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="searchModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Kết quả tìm kiếm</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <div class="list-group list-group-flush" id="searchResults"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="playlistModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Playlist Đã Lưu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="playlistContainer" class="list-group">Đang tải...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const BASE_URL = "/mosa"; 
        let currentGuildId = localStorage.getItem('lastGuild') || "";
        let isFetching = false;
        let isDragging = false; 
        let isSeeking = false; 
        
        const searchModal = new bootstrap.Modal(document.getElementById('searchModal'));
        const playlistModal = new bootstrap.Modal(document.getElementById('playlistModal'));
        let cachedPlaylists = [];

        // Kéo thả hàng đợi
        let queueSortable = new Sortable(document.getElementById('queueList'), {
            animation: 150, draggable: ".queue-item", handle: ".queue-item", // Kéo thả toàn bộ item
            onStart: function() { isDragging = true; },
            onEnd: function(evt) { isDragging = false; if(evt.oldIndex !== evt.newIndex) moveQueueItem(evt.oldIndex, evt.newIndex); }
        });

        window.onload = () => { loadGuilds(); setInterval(updateState, 1000); }

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return "00:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min < 10 ? '0' : ''}${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function seekAudio(val) {
            isSeeking = false; 
            if(currentGuildId) fetch(`${BASE_URL}/api/control/seek?guild_id=${currentGuildId}&seconds=${val}`, {method: 'POST'});
        }

        function updateState() {
            if(!currentGuildId || isFetching || isDragging) return; 
            isFetching = true;
            fetch(`${BASE_URL}/api/status?guild_id=${currentGuildId}`).then(r=>r.json()).then(d => {
                // UI: Album Art & Info
                const art = document.getElementById('trackArt'), ph = document.getElementById('noMusicPlaceholder');
                if(d.thumbnail && d.title) { 
                    art.src = d.thumbnail; art.style.display = 'block'; ph.style.display = 'none'; 
                    document.getElementById('trackTitle').innerText = d.title; 
                    document.getElementById('trackArtist').innerText = d.channel || "Đang phát"; 
                } else { 
                    art.style.display = 'none'; art.src = ""; ph.style.display = 'flex'; 
                    document.getElementById('trackTitle').innerText = "Sẵn sàng"; 
                    document.getElementById('trackArtist').innerText = "Vui lòng chọn bài hát"; 
                }
                
                // UI: Status
                const st = document.getElementById('trackChannel');
                if(d.connected_channel) { st.innerHTML = `<i class="fas fa-wifi"></i> ${d.connected_channel}`; st.className = "status-badge status-connected"; } 
                else { st.innerHTML = "Chưa kết nối"; st.className = "status-badge"; }
                
                // Sync Dropdown
                const chSel = document.getElementById('channelSelect');
                if (d.connected_channel_id && chSel.options.length > 1) {
                     let options = Array.from(chSel.options);
                     if (options.some(o => o.value === d.connected_channel_id) && chSel.value !== d.connected_channel_id) chSel.value = d.connected_channel_id;
                }

                // UI: Controls
                document.getElementById('iconPlay').className = d.is_playing ? "fas fa-pause" : "fas fa-play";
                document.getElementById('btnLoop').className = d.loop ? "btn-active" : "";
                
                // UI: Progress
                if (!isSeeking && d.duration > 0) {
                    const bar = document.getElementById('progressBar');
                    bar.max = d.duration;
                    bar.value = d.position;
                    document.getElementById('timeCurrent').innerText = formatTime(d.position);
                    document.getElementById('timeTotal').innerText = formatTime(d.duration);
                }

                // UI: Queue
                const qDiv = document.getElementById('queueList'); let html = "";
                if(d.queue && d.queue.length > 0) {
                    d.queue.forEach((s, i) => {
                        html += `
                        <div class="queue-item">
                            <span class="q-idx">${i+1}</span>
                            <div class="q-info">
                                <div class="q-title">${s.title}</div>
                                <div class="q-artist">Sắp phát</div>
                            </div>
                            <i class="fas fa-bars q-drag"></i>
                        </div>`;
                    });
                } else {
                    html = '<div class="text-center text-muted py-5"><i class="fas fa-music mb-2" style="font-size: 2rem; opacity: 0.3;"></i><br>Hàng đợi trống</div>';
                }
                if(qDiv.innerHTML !== html) qDiv.innerHTML = html; 
                isFetching = false;
            }).catch(() => isFetching = false);
        }

        // Logic functions (giữ nguyên logic)
        function moveQueueItem(fromIdx, toIdx) { if(currentGuildId) fetch(`${BASE_URL}/api/queue/move?guild_id=${currentGuildId}&from=${fromIdx}&to=${toIdx}`, {method: 'POST'}); }
        
        function openPlaylists() {
            playlistModal.show();
            fetch(`${BASE_URL}/api/playlists`).then(r=>r.json()).then(d => {
                cachedPlaylists = d; 
                const cont = document.getElementById('playlistContainer');
                if(d.length === 0) { cont.innerHTML = '<div class="text-center py-3">Chưa có playlist nào được lưu.</div>'; return; }
                let html = '';
                d.forEach((pl, idx) => {
                    html += `<div class="list-group-item bg-dark text-white border-secondary mb-2 rounded"><div class="d-flex justify-content-between align-items-center"><div><h6 class="mb-0 fw-bold">${pl.name} <span class="badge bg-success ms-2" style="font-size:0.6rem">${pl.count} bài</span></h6><small class="text-muted">Tạo bởi: ${pl.owner}</small></div><div class="btn-group"><button onclick="toggleTracks(${idx})" class="btn btn-sm btn-outline-secondary">Xem</button><button onclick="playFullPlaylist('${pl.owner_id}', '${pl.name}')" class="btn btn-sm btn-success"><i class="fas fa-play"></i> Phát</button></div></div><div id="tracks-${idx}" style="display:none; margin-top:10px; border-top:1px solid #333; padding-top:5px;">${pl.tracks.map(t => `<div class="d-flex justify-content-between align-items-center py-1 border-bottom border-secondary" style="font-size:0.85rem;"><span class="text-truncate me-2">${t.title}</span><button onclick="playSingleTrack('${t.webpage_url || t.url}')" class="btn btn-sm text-primary"><i class="fas fa-play"></i></button></div>`).join('')}</div></div>`;
                });
                cont.innerHTML = html;
            });
        }
        
        function toggleTracks(idx) { const el = document.getElementById(`tracks-${idx}`); el.style.display = el.style.display === 'block' ? 'none' : 'block'; }
        function playFullPlaylist(uid, name) { if(!currentGuildId) return alert("Chưa chọn server!"); fetch(`${BASE_URL}/api/playlist/play_all?guild_id=${currentGuildId}&user_id=${uid}&name=${encodeURIComponent(name)}`, {method:'POST'}).then(r=>r.json()).then(d => { if(d.status === 'ok') { alert("Đã thêm playlist!"); playlistModal.hide(); } else alert("Lỗi: " + d.message); }); }
        function playSingleTrack(url) { playDirect(url); }
        
        function loadGuilds() {
            fetch(`${BASE_URL}/api/guilds`).then(r=>r.json()).then(d => {
                const sel = document.getElementById('guildSelect'); sel.innerHTML = '<option value="" disabled selected>Server...</option>';
                if(d.length === 0) return; d.forEach(g => sel.add(new Option(g.name, g.id)));
                if(currentGuildId && d.some(g => g.id === currentGuildId)) { sel.value = currentGuildId; loadChannels(); } 
                else if (d.length === 1) { sel.value = d[0].id; loadChannels(); }
            }).catch(e => console.log("API Error"));
        }
        function loadChannels() {
            const gid = document.getElementById('guildSelect').value; localStorage.setItem('lastGuild', gid); currentGuildId = gid;
            const chSel = document.getElementById('channelSelect'); if (chSel.options.length <= 1) chSel.innerHTML = '<option disabled selected>Đang tải...</option>';
            fetch(`${BASE_URL}/api/channels?guild_id=${gid}`).then(r=>r.json()).then(d => {
                const currentVal = chSel.value; chSel.innerHTML = '<option disabled selected>Kênh...</option>';
                d.forEach(c => chSel.add(new Option(c.name, c.id)));
                if (currentVal && Array.from(chSel.options).some(o => o.value === currentVal)) chSel.value = currentVal;
            });
        }
        function joinChannel() { const gid = currentGuildId; const cid = document.getElementById('channelSelect').value; if(!gid || !cid || cid.startsWith("Kênh")) return alert("Chọn Server và Kênh!"); fetch(`${BASE_URL}/api/join?guild_id=${gid}&channel_id=${cid}`, {method:'POST'}).then(r=>r.json()).then(d => { if(d.status === 'ok') alert("Bot đang vào..."); }); }
        function leaveChannel() { if(currentGuildId) fetch(`${BASE_URL}/api/control/leave?guild_id=${currentGuildId}`, {method:'POST'}); }
        function cmd(a) { if(currentGuildId) fetch(`${BASE_URL}/api/control/${a}?guild_id=${currentGuildId}`, {method:'POST'}); }
        function handleEnter(e) { if(e.key === 'Enter') handleSearchOrPlay(); }
        function handleSearchOrPlay() {
            const q = document.getElementById('searchQuery').value.trim(); if(!currentGuildId) return alert("⚠️ Bạn chưa chọn Server!"); if(!q) return alert("⚠️ Vui lòng nhập thông tin!");
            const btn = document.querySelector('.search-btn'); const originalIcon = btn.innerHTML; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            if (q.startsWith("http")) { playDirect(q); btn.innerHTML = originalIcon; } 
            else {
                fetch(`${BASE_URL}/api/search?query=${encodeURIComponent(q)}`).then(r => r.json()).then(data => {
                    btn.innerHTML = originalIcon; if(data.length === 0) return alert("Không tìm thấy!");
                    const list = document.getElementById('searchResults'); list.innerHTML = "";
                    data.forEach(s => {
                        const item = document.createElement('div'); item.className = "list-group-item d-flex align-items-center";
                        item.onclick = () => { playDirect(s.url); searchModal.hide(); };
                        item.innerHTML = `<img src="${s.thumbnail||'https://i.imgur.com/t2107W6.png'}" style="width:50px; height:40px; object-fit:cover; margin-right:15px; border-radius:4px;"><div><div class="fw-bold text-truncate" style="max-width:250px; font-size:0.9rem;">${s.title}</div><small class="text-muted" style="font-size:0.75rem;">${s.uploader} • ${s.duration}</small></div>`;
                        list.appendChild(item);
                    }); searchModal.show();
                }).catch(() => { btn.innerHTML = originalIcon; alert("Lỗi tìm kiếm."); });
            }
        }
        function playDirect(url) { fetch(`${BASE_URL}/api/play?guild_id=${currentGuildId}&query=${encodeURIComponent(url)}`, {method:'POST'}).then(() => document.getElementById('searchQuery').value = ''); }
    </script>
</body>
