<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosa - Bảng điều khiển</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col overflow-hidden">

    <!-- Header / Navbar -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center shadow-md z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-500 rounded-full flex items-center justify-center text-xl shadow-lg">
                <i class="fa-solid fa-robot"></i>
            </div>
            <h1 class="text-xl font-bold tracking-wider">MOSA MUSIC</h1>
        </div>
        
        <!-- Thông tin User -->
        <div class="flex items-center gap-4">
            <span class="text-sm font-medium text-gray-300">
                Xin chào, <span class="text-indigo-400">{{ user.username if user else 'Khách' }}</span>
            </span>
            {% if user and user.avatar %}
                <img src="https://cdn.discordapp.com/avatars/{{ user.id }}/{{ user.avatar }}.png" alt="Avatar" class="w-10 h-10 rounded-full border-2 border-indigo-500">
            {% else %}
                <div class="w-10 h-10 rounded-full bg-gray-600 flex items-center justify-center"><i class="fa-solid fa-user"></i></div>
            {% endif %}
            <a href="/logout" class="bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded text-sm transition font-semibold"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col md:flex-row p-6 gap-6 overflow-hidden">
        
        <!-- Left: Music Player -->
        <div class="flex-1 bg-gray-800 rounded-2xl shadow-2xl p-8 flex flex-col items-center justify-center border border-gray-700 relative overflow-hidden">
            <!-- Background mờ ảo -->
            <div class="absolute inset-0 bg-gradient-to-br from-indigo-900/20 to-purple-900/20 z-0"></div>

            <!-- Thumbnail -->
            <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=500&auto=format&fit=crop" 
                 alt="Thumbnail" 
                 class="w-64 h-64 object-cover rounded-2xl shadow-2xl mb-8 z-10 border-4 border-gray-700">
            
            <!-- Song Info -->
            <div class="text-center z-10 w-full px-4">
                <h2 class="text-2xl font-bold mb-1 truncate" id="song-title">Đang kết nối...</h2>
                <p class="text-indigo-400 mb-6" id="song-artist">Hãy tham gia kênh thoại để phát nhạc</p>
            </div>

            <!-- Progress Bar -->
            <div class="w-full max-w-md flex items-center gap-3 z-10 mb-6 text-sm text-gray-400">
                <span>00:00</span>
                <div class="flex-1 h-2 bg-gray-700 rounded-full overflow-hidden cursor-pointer">
                    <div class="h-full bg-indigo-500 w-1/3 rounded-full relative">
                        <div class="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full shadow"></div>
                    </div>
                </div>
                <span>03:45</span>
            </div>

            <!-- Controls -->
            <div class="flex items-center gap-6 z-10">
                <button onclick="control('shuffle')" class="text-gray-400 hover:text-white transition"><i class="fa-solid fa-shuffle text-xl"></i></button>
                <button onclick="control('prev')" class="text-gray-200 hover:text-indigo-400 transition"><i class="fa-solid fa-backward-step text-3xl"></i></button>
                
                <button onclick="control('pause_resume')" class="w-16 h-16 bg-indigo-500 hover:bg-indigo-600 text-white rounded-full flex items-center justify-center transition shadow-lg hover:scale-105">
                    <i class="fa-solid fa-play text-2xl ml-1"></i>
                </button>
                
                <button onclick="control('skip')" class="text-gray-200 hover:text-indigo-400 transition"><i class="fa-solid fa-forward-step text-3xl"></i></button>
                <button onclick="control('stop')" class="text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-stop text-xl"></i></button>
            </div>
        </div>

        <!-- Right: Queue & Search -->
        <div class="w-full md:w-96 bg-gray-800 rounded-2xl shadow-xl flex flex-col border border-gray-700 overflow-hidden">
            
            <!-- Search Bar -->
            <div class="p-4 border-b border-gray-700 bg-gray-800/50">
                <div class="relative">
                    <input type="text" id="searchQuery" placeholder="Tìm kiếm bài hát hoặc dán link URL..." 
                           class="w-full bg-gray-900 border border-gray-600 text-white text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full pl-10 p-2.5 outline-none transition">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
                    </div>
                </div>
                <button onclick="searchSong()" class="mt-3 w-full bg-indigo-500 hover:bg-indigo-600 text-white font-medium py-2 rounded-lg transition text-sm">
                    Thêm vào hàng đợi
                </button>
            </div>

            <!-- Queue List -->
            <div class="p-4 flex-1 overflow-y-auto custom-scrollbar">
                <h3 class="font-bold text-gray-300 mb-4 uppercase text-sm tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-list-ul"></i> Hàng đợi tiếp theo
                </h3>
                
                <ul class="space-y-3">
                    <!-- Queue Item Template -->
                    <li class="flex items-center gap-3 p-2 hover:bg-gray-700 rounded-lg transition cursor-pointer group">
                        <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?q=80&w=100&auto=format&fit=crop" class="w-12 h-12 rounded object-cover">
                        <div class="flex-1 overflow-hidden">
                            <p class="text-sm font-semibold truncate text-white">Chưa có bài hát nào</p>
                            <p class="text-xs text-gray-400 truncate">Hàng đợi trống</p>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </main>

    <!-- Bổ sung thẻ script kiểu module ở cuối file HTML -->
    <script type="module">
        // 1. Nhập SDK của Discord (từ CDN)
        import { DiscordSDK } from "https://unpkg.com/@discord/embedded-app-sdk@1.2.0/lib/index.mjs";
    
        const discordSdk = new DiscordSDK("YOUR_CLIENT_ID");
    
        async function setupDiscordActivity() {
            // 2. Chờ SDK sẵn sàng
            await discordSdk.ready();
            console.log("Discord SDK đã sẵn sàng!");
        
            try {
                // 3. Xin quyền người dùng (Hiện popup mượt mà trong Discord)
                const { code } = await discordSdk.commands.authorize({
                    client_id: "YOUR_CLIENT_ID",
                    response_type: "code",
                    state: "",
                    prompt: "none",
                    scope: ["identify", "guilds"] // Các quyền cần lấy
                });
            
                // 4. Gửi 'code' về Flask Backend để đổi lấy access_token
                const response = await fetch('/api/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });
                const { access_token } = await response.json();
            
                // 5. Authenticate Activity bằng access_token
                const auth = await discordSdk.commands.authenticate({
                    access_token: access_token
                });
            
                if (auth == null) {
                    throw new Error("Authenticate thất bại");
                }
            
                console.log("Đăng nhập thành công với tài khoản:", auth.user.username);
                
                // Cập nhật giao diện với thông tin User
                document.getElementById("user-name").innerText = auth.user.username;
                
                if(auth.user.avatar) {
                    const avatarUrl = `https://cdn.discordapp.com/avatars/${auth.user.id}/${auth.user.avatar}.png`;
                    document.getElementById("user-avatar").src = avatarUrl;
                }
            
            } catch (error) {
                console.error("Lỗi đăng nhập Activity:", error);
            }
        }
    
        // Khởi chạy khi load trang
        setupDiscordActivity();
    </script>

    <!-- Script kết nối API (Ví dụ mẫu) -->
    <script>
        // Gọi API điều khiển được cấu hình trong webserver.py
        function control(action) {
            console.log("Đã nhấn nút: " + action);
            // fetch('/api/control/' + action, { method: 'POST' })
            //   .then(res => res.json())
            //   .then(data => console.log(data));
        }

        function searchSong() {
            const query = document.getElementById('searchQuery').value;
            if(!query) return alert("Vui lòng nhập tên bài hát!");
            console.log("Đang tìm: " + query);
            // fetch('/api/play', { method: 'POST', body: JSON.stringify({query: query}) })
            document.getElementById('searchQuery').value = '';
        }
        
        // Polling để lấy trạng thái nhạc (Cần API GET /api/status/<guild_id>)
        // setInterval(() => { fetchStatus() }, 3000);
    </script>
</body>
</html>
