<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosa Activity</title>
    <!-- SỬ DỤNG CSS THUẦN ĐỂ KHÔNG BAO GIỜ BỊ DISCORD CHẶN -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #111827; color: #f3f4f6; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* HEADER */
        .header { background-color: #1f2937; border-bottom: 1px solid #374151; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 10; }
        .logo-box { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: bold; }
        .bot-icon { background-color: #6366f1; width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; }
        .user-info { display: flex; align-items: center; gap: 15px; font-size: 0.9rem; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #6366f1; object-fit: cover; }
        
        /* MAIN CONTENT */
        .main-content { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background-color: #1f2937; border: 1px solid #374151; border-radius: 15px; padding: 40px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); max-width: 450px; width: 100%; }
        .card h2 { color: #818cf8; margin-bottom: 10px; font-size: 1.5rem; }
        .card p { color: #9ca3af; margin-bottom: 30px; }
        
        /* CONTROLS */
        .controls { display: flex; justify-content: center; align-items: center; gap: 20px; }
        .btn-icon { background: none; border: none; color: #9ca3af; font-size: 30px; cursor: pointer; transition: 0.2s; }
        .btn-icon:hover { color: #fff; }
        .btn-play { width: 60px; height: 60px; background-color: #6366f1; color: white; border: none; border-radius: 50%; font-size: 25px; cursor: pointer; box-shadow: 0 10px 15px rgba(0,0,0,0.3); transition: 0.2s; }
        .btn-play:hover { background-color: #4f46e5; transform: scale(1.05); }

        /* LOADING SCREEN */
        #loading-screen { position: absolute; inset: 0; background-color: #111827; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 50; transition: opacity 0.5s; }
        .spinner { border: 4px solid #374151; border-top: 4px solid #6366f1; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* BẢNG BÁO LỖI (DEBUG LOG) */
        #debug-log { margin-top: 20px; padding: 15px; background: #000; border-radius: 8px; color: #10b981; font-family: monospace; font-size: 13px; text-align: left; max-width: 400px; width: 100%; word-wrap: break-word; border: 1px solid #374151; }
        .err-text { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>

    <!-- MÀN HÌNH LOADING & BÁO LỖI -->
    <div id="loading-screen">
        <div class="spinner" id="spinner"></div>
        <h2 style="font-size: 1.5rem; margin-bottom: 10px;" id="loading-title">Đang kết nối Discord SDK...</h2>
        <p style="color: #9ca3af;" id="loading-desc">Quá trình này mất vài giây. Vui lòng phê duyệt nếu được yêu cầu.</p>
        
        <!-- Màn hình in lỗi trực tiếp -->
        <div id="debug-log">Vui lòng chờ...<br></div>
    </div>

    <!-- HEADER -->
    <header class="header">
        <div class="logo-box">
            <div class="bot-icon">🤖</div>
            <span>MOSA MUSIC</span>
        </div>
        <div class="user-info">
            <span id="user-name">Đang tải...</span>
            <img id="user-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" class="avatar" alt="Avatar">
        </div>
    </header>

    <!-- NỘI DUNG CHÍNH -->
    <main class="main-content">
        <div class="card">
            <div style="font-size: 60px; margin-bottom: 20px;">🎧</div>
            <h2>Dashboard Sẵn Sàng</h2>
            <p>Xác thực thành công. Trình phát nhạc sẽ hiện tại đây!</p>
            
            <div class="controls">
                <button class="btn-icon">⏮️</button>
                <button class="btn-play">▶️</button>
                <button class="btn-icon">⏭️</button>
            </div>
        </div>
    </main>

    <!-- SCRIPT CHÍNH -->
    <script type="module">
        const debugLog = document.getElementById("debug-log");
        const loadingTitle = document.getElementById("loading-title");
        const spinner = document.getElementById("spinner");

        function log(msg, isError = false) {
            debugLog.innerHTML += `<span class="${isError ? 'err-text' : ''}">${msg}</span><br>`;
            if (isError) {
                loadingTitle.innerText = "Kết nối thất bại!";
                loadingTitle.style.color = "#ef4444";
                spinner.style.display = "none";
            }
        }

        async function init() {
            try {
                // 1. NHẬP CLIENT ID CỦA BẠN VÀO ĐÂY (Bắt buộc là DÃY SỐ)
                const CLIENT_ID = 1321104228361703424; 

                log("1. Đang tải SDK...");
                const module = await import("https://unpkg.com/@discord/embedded-app-sdk@1.2.0/lib/index.mjs");
                const DiscordSDK = module.DiscordSDK;
                
                log("2. Khởi tạo SDK...");
                const discordSdk = new DiscordSDK(CLIENT_ID);
                await discordSdk.ready();

                log("3. Đang gọi hộp thoại Authorize...");
                const { code } = await discordSdk.commands.authorize({
                    client_id: CLIENT_ID,
                    response_type: "code",
                    state: "",
                    prompt: "none",
                    scope: ["identify", "guilds"]
                });

                log("4. Đã lấy Code. Gửi tới Flask...");
                const response = await fetch('/api/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });
                
                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`Server báo lỗi: ${errText}`);
                }

                const data = await response.json();
                
                log("5. Có Token. Đang Authenticate...");
                const auth = await discordSdk.commands.authenticate({ access_token: data.access_token });
                
                if (auth) {
                    log("6. Đăng nhập HOÀN TẤT!");
                    document.getElementById("user-name").innerText = auth.user.username;
                    if(auth.user.avatar) {
                        document.getElementById("user-avatar").src = `https://cdn.discordapp.com/avatars/${auth.user.id}/${auth.user.avatar}.png`;
                    }
                    
                    // Ẩn loading
                    const loadingScreen = document.getElementById("loading-screen");
                    loadingScreen.style.opacity = "0";
                    setTimeout(() => loadingScreen.style.display = "none", 500);
                }
            } catch (error) {
                log(`Lỗi: ${error.message || error}`, true);
                console.error(error);
            }
        }

        init();
    </script>
</body>
</html>
