<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosa Music - Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white h-screen flex items-center justify-center">
    <div class="bg-gray-800 p-10 rounded-2xl shadow-2xl flex flex-col items-center max-w-md w-full text-center border border-gray-700">
        <div class="w-24 h-24 bg-gray-700 rounded-full flex items-center justify-center mb-6 shadow-lg">
            <i class="fa-solid fa-music text-4xl text-indigo-400"></i>
        </div>
        
        <h1 class="text-3xl font-bold mb-2">Mosa Dashboard</h1>
        <p class="text-gray-400 mb-8" id="login-text">Đăng nhập để điều khiển trình phát nhạc.</p>
        
        <!-- Nút đăng nhập Web truyền thống -->
        <a href="{{ auth_url }}" id="web-login-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-lg w-full transition duration-300 flex items-center justify-center gap-3">
            <i class="fa-brands fa-discord text-xl"></i> Đăng nhập trên Web
        </a>

        <!-- Màn hình Loading cho Discord Activity -->
        <div id="activity-loading" style="display: none;" class="w-full py-3 flex flex-col items-center">
            <i class="fas fa-spinner fa-spin text-3xl text-indigo-400 mb-3"></i>
            <span class="text-gray-300">Đang tự động xác thực với Discord...</span>
        </div>
    </div>

    <script type="module">
        import { DiscordSDK } from '/static/discord-sdk.mjs';

        const urlParams = new URLSearchParams(window.location.search);
        
        // Nếu có frame_id nghĩa là đang chạy qua Discord Activity
        if (urlParams.has('frame_id')) {
            document.getElementById('web-login-btn').style.display = 'none';
            document.getElementById('activity-loading').style.display = 'flex';
            document.getElementById('login-text').innerText = "Đang kết nối SDK...";

            async function initSDKAuth() {
                try {
                    const discordSdk = new DiscordSDK("{{ client_id }}");
                    await discordSdk.ready();

                    const { code } = await discordSdk.commands.authorize({
                        client_id: "{{ client_id }}",
                        response_type: "code",
                        state: "",
                        prompt: "none",
                        scope: ["identify", "guilds"]
                    });

                    const response = await fetch('/api/activity-token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code: code })
                    });

                    if (response.ok) {
                        // Trở về index kèm query param ban đầu
                        window.location.href = '/' + window.location.search;
                    } else {
                        alert("Lỗi xác thực Activity Server");
                    }
                } catch (error) {
                    console.error(error);
                    alert("Lỗi khởi tạo SDK: " + error.message);
                }
            }

            initSDKAuth();
        }
    </script>
</body>
</html>
