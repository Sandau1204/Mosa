<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosa Music - Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .discord-bg { background-color: #5865F2; }
        .discord-bg:hover { background-color: #4752C4; }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen flex items-center justify-center">

    <div class="bg-gray-800 p-10 rounded-2xl shadow-2xl flex flex-col items-center max-w-md w-full text-center border border-gray-700">
        <!-- Logo Bot (Có thể thay bằng ảnh thật) -->
        <div class="w-24 h-24 bg-gray-700 rounded-full flex items-center justify-center mb-6 shadow-lg">
            <i class="fa-solid fa-music text-4xl text-indigo-400"></i>
        </div>
        
        <h1 class="text-3xl font-bold mb-2">Mosa Dashboard</h1>
        <p class="text-gray-400 mb-8">Đăng nhập bằng tài khoản Discord của bạn để đồng bộ và điều khiển trình phát nhạc.</p>
        
        <!-- Nút Đăng nhập -->
        <a href="/login" class="discord-bg text-white font-semibold py-3 px-6 rounded-lg w-full transition duration-300 flex items-center justify-center gap-3 shadow-lg">
            <i class="fa-brands fa-discord text-xl"></i>
            Đăng nhập với Discord
        </a>
    </div>

</body>
</html>
