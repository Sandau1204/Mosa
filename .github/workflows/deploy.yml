name: Deploy Bot to Windows Server

on:
  push:
    branches:
      - main  # Trigger khi có code mới đẩy lên nhánh main

jobs:
  deploy:
    runs-on: self-hosted  # Bắt buộc phải là self-hosted để chạy trên server của bạn

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Tạo file .env tự động
        run: |
          echo "DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}" | Out-File -FilePath .env -Encoding ascii
          echo "OWNER_ID=${{ secrets.OWNER_ID }}" | Out-File -FilePath .env -Encoding ascii -Append
          echo "DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}" | Out-File -FilePath .env -Encoding ascii -Append
          echo "DISCORD_CLIENT_SECRET=${{ secrets.DISCORD_CLIENT_SECRET }}" | Out-File -FilePath .env -Encoding ascii -Append
          echo "DISCORD_REDIRECT_URI=${{ secrets.DISCORD_REDIRECT_URI }}" | Out-File -FilePath .env -Encoding ascii -Append
          echo "DATA_FOLDER=${{ secrets.DATA_FOLDER }}" | Out-File -FilePath .env -Encoding ascii -Append
          echo "PROXY_URL=${{ secrets.PROXY_URL }}" | Out-File -FilePath .env -Encoding ascii -Append
          
      - name: Copy file cookies vào thư mục vận hành
        # Lệnh này copy file từ vị trí lưu trữ trên server vào thư mục chứa code hiện tại
        # Hãy đổi "C:\duong\dan\toi\cookies.txt" thành đường dẫn thật tới file cookies của bạn
        run: |
          Copy-Item -Path "C:\Users\Administrator\Documents\cookies.txt" -Destination ".\cookies.txt" -Force
          

      - name: Cài đặt/Cập nhật thư viện Python
        # Lệnh này sẽ cài đặt các gói cần thiết như discord.py, flask, yt-dlp từ requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U yt-dlp

      - name: Khởi động lại Bot Service
        # Dừng và khởi động lại bot để áp dụng code mới (Yêu cầu PowerShell chạy dưới quyền Admin)
        run: |
          Restart-Service -Name "DiscordBot"