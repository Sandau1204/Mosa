name: Deploy to Windows Home Server
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: self-hosted # Chạy trực tiếp trên máy tính cài runner
    steps:
      - name: Deploy Script
        run: |
          echo "Đang bắt đầu quá trình deploy trên Windows Server 2019..."
          
          # 1. Di chuyển vào thư mục chứa code bot thực tế
          cd C:\Users\Administrator\Documents\Mosa
          
          # 2. Reset các thay đổi local (nếu có) và kéo code mới nhất về
          git reset --hard
          git pull origin main
          
          # 3. Kích hoạt môi trường ảo Python (Lệnh chuẩn của Windows)
          .\venv\Scripts\activate
          
          # 4. Cài đặt các thư viện mới (nếu file requirements.txt có thay đổi)
          pip install -r requirements.txt
          
          # 5. Khởi động lại PM2
          pm2 restart mosa-bot
          
          echo "Deploy hoàn tất thành công!"
