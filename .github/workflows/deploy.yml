name: Deploy Bot to VPS

on:
  push:
    branches: [ "main" ] # Hoặc "master" tùy tên nhánh của bạn

jobs:
  deploy:
    runs-on: self-hosted # Quan trọng: Lệnh này bảo nó chạy trên VPS của bạn

    steps:
    # 1. Lấy code mới nhất về VPS
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        clean: false # KHÔNG xóa file .env và cookies.txt cũ

    # 2. Cài đặt thư viện (nếu có thêm mới)
    - name: Install dependencies
      run: |
        pip3 install -r requirements.txt --break-system-packages

    # 3. Khởi động lại Bot để nhận code mới
    - name: Restart Bot Service
      run: |
        sudo systemctl restart mosabot