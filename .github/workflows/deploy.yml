name: Deploy Bot to Windows Server

on:
  push:
    branches:
      - main  # Trigger khi có code mới đẩy lên nhánh main

jobs:
  deploy:
    runs-on: self-hosted  # Bắt buộc phải là self-hosted để chạy trên server của bạn

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt/Cập nhật thư viện Python
        # Lệnh này sẽ cài đặt các gói cần thiết như discord.py, flask, yt-dlp từ requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Khởi động lại Bot Service
        # Dừng và khởi động lại bot để áp dụng code mới (Yêu cầu PowerShell chạy dưới quyền Admin)
        run: |
          Restart-Service -Name "DiscordBot"